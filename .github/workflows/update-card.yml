name: Update Profile Card

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests python-dateutil

      - name: Generate SVGs
        env:
          ACCESS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python profile.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add profile.svg profile-dark.svg profile-light.svg
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: auto-update profile SVGs"
          git push