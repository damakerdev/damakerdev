name: Update Profile Card

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests python-dateutil

      - name: Generate SVGs
        env:
          ACCESS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python profile.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: auto-update profile SVGs [skip ci]"
          file_pattern: "profile.svg profile-dark.svg profile-light.svg"
          skip_dirty_check: false
          commit_options: '--allow-empty=false'
